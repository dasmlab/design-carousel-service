apiVersion: apps/v1
kind: Deployment
metadata:
  name: design-carousel-service
  namespace: design-carousel-service-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: design-carousel-service
  template:
    metadata:
      labels:
        app: design-carousel-service
    spec:
      imagePullSecrets:
        - name: dasmlab-ghcr-pull
      containers:
        - name: design-carousel-service
          image: ghcr.io/lmcdasm/design-carousel-service:__VERSION__
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 10022
              protocol: TCP
            - name: metrics
              containerPort: 9222
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /isalive
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /isalive
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: design-carousel-service
  namespace: design-carousel-service-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9222"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: design-carousel-service
  type: ClusterIP
  ports:
    - name: api
      port: 10022
      targetPort: api
      protocol: TCP
    - name: metrics
      port: 9222
      targetPort: metrics
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: design-carousel-service
  namespace: design-carousel-service-system
spec:
  host: design-carousel.svc.dasmlab.org
  to:
    kind: Service
    name: design-carousel-service
    weight: 100
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
